name: Portfolio read-only smoke

on:
  push:
    branches:
      - feature/portfolio-data
    paths:
      - ".github/workflows/smoke-readonly.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Build production CA bundle
        run: |
          python docker/build_ca_bundle.py ca_bundle.pem
          test -s ca_bundle.pem

      - name: Write temporary Google service account credentials
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          umask 077
          printf '%s' "$GOOGLE_CREDENTIALS_JSON" > "$RUNNER_TEMP/credentials.json"

      - name: Check T-Invest portfolios and Google Sheets metadata
        env:
          TINVEST_TOKEN: ${{ secrets.TINVEST_TOKEN }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: ${{ runner.temp }}/credentials.json
        run: |
          python -u - <<'PY'
          import json
          import os
          import re
          import ssl
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          import certifi
          import requests
          import urllib3

          from google.oauth2.service_account import Credentials
          from googleapiclient.discovery import build
          from tinvest_sync.api import TInvestClient
          from tinvest_sync.sheets import _normalize_sheet_date

          stage = "configuration"
          redactions = []

          def emit(label, value):
              text = json.dumps(value, ensure_ascii=True, default=str)
              for secret in sorted(set(redactions), key=len, reverse=True):
                  if secret:
                      text = text.replace(json.dumps(secret)[1:-1], "[redacted]")
              # Prefix prevents API-provided text from becoming a runner command.
              print(f"{label}: {text}")

          def sanitized_reason(exc):
              reason = str(exc)
              for secret in sorted(set(redactions), key=len, reverse=True):
                  if secret:
                      reason = reason.replace(secret, "[redacted]")
              reason = re.sub(r"(?im)authorization[^\r\n]*", "[redacted header]", reason)
              reason = re.sub(r"(?i)bearer\s+\S+", "[redacted credential]", reason)
              reason = re.sub(
                  r"(?i)(account[_-]?id[\"']?\s*[:=]\s*[\"']?)[^\s,\"'&})]+",
                  r"\1[redacted]", reason,
              )
              # Also cover numeric account IDs before GetAccounts returns any IDs.
              return re.sub(r"\b\d{6,}\b", "[redacted number]", reason)

          def emit_exception(label, exc):
              emit(label, {
                  "type": type(exc).__name__,
                  "cause_type": type(exc.__cause__).__name__ if exc.__cause__ else None,
                  "context_type": type(exc.__context__).__name__ if exc.__context__ else None,
                  "reason": sanitized_reason(exc),
              })

          def operation_watermarks(values):
              # Match production get_last_operation_dates_by_account semantics.
              dates = {}
              for row in values[1:]:
                  if len(row) < 3:
                      continue
                  raw_account_id = row[2]
                  if isinstance(raw_account_id, str):
                      account_id = raw_account_id.strip()
                  elif isinstance(raw_account_id, int) and not isinstance(raw_account_id, bool):
                      account_id = str(raw_account_id)
                  elif isinstance(raw_account_id, float) and raw_account_id.is_integer():
                      account_id = str(int(raw_account_id))
                  else:
                      continue
                  if not account_id or isinstance(row[0], bool):
                      continue
                  try:
                      text = _normalize_sheet_date(row[0])
                      if not text:
                          continue
                      date = datetime.fromisoformat(text.replace("Z", "+00:00"))
                      if date.tzinfo is None:
                          date = date.replace(tzinfo=timezone.utc)
                      date = date.astimezone(timezone.utc)
                  except (ValueError, OverflowError):
                      continue
                  if account_id not in dates or date > dates[account_id]:
                      dates[account_id] = date
              return dates

          try:
              token = os.environ["TINVEST_TOKEN"].strip()
              spreadsheet_id = os.environ["GOOGLE_SPREADSHEET_ID"].strip()
              if not token or not spreadsheet_id:
                  raise ValueError("Missing configuration")
              redactions.extend([token, spreadsheet_id])

              stage = "GetAccounts"
              client = TInvestClient(token, verify_ssl="ca_bundle.pem")
              emit("tls", {
                  "requests_version": requests.__version__,
                  "urllib3_version": urllib3.__version__,
                  "certifi_version": certifi.__version__,
                  "certifi_path": certifi.where(),
                  "openssl_version": ssl.OPENSSL_VERSION,
                  "session_verify": client._session.verify,
                  "repo_ca_bundle_exists": Path("ca_bundle.pem").is_file(),
              })

              # A separate Session has no T-Invest token or default auth headers.
              # Disable ambient netrc authentication as well.
              class NoAuth(requests.auth.AuthBase):
                  def __call__(self, request):
                      request.headers.pop("Authorization", None)
                      return request

              try:
                  with requests.get(
                      "https://invest-public-api.tbank.ru/",
                      timeout=15, verify="ca_bundle.pem",
                      auth=NoAuth(), allow_redirects=False,
                  ) as probe:
                      emit("https_probe", {"success": True, "status_code": probe.status_code})
              except requests.exceptions.RequestException as exc:
                  emit_exception("https_probe_failed", exc)

              accounts = client.get_accounts()
              redactions.extend(account.id for account in accounts)
              emit("accounts_count", len(accounts))

              for account in accounts:
                  masked_id = "***" + account.id[-4:] if len(account.id) > 4 else "***"
                  emit("account", {
                      "account_id": masked_id,
                      "type": account.type,
                      "status": account.status,
                  })
                  if account.status != "ACCOUNT_STATUS_OPEN" or account.type not in (
                      "ACCOUNT_TYPE_TINKOFF", "ACCOUNT_TYPE_TINKOFF_IIS",
                  ):
                      continue

                  stage = "GetPortfolio"
                  positions = client.get_portfolio(account)
                  emit("portfolio", {
                      "account_id": masked_id,
                      "positions_count": len(positions),
                  })
                  for position in positions[:3]:
                      emit("position", {
                          "ticker": position.ticker,
                          "instrument_type": position.instrument_type,
                          "quantity": position.quantity,
                          "current_price": position.current_price,
                          "currency": position.currency,
                          "expected_yield": position.expected_yield,
                      })

              stage = "Google Sheets metadata"
              credentials = Credentials.from_service_account_file(
                  os.environ["GOOGLE_SERVICE_ACCOUNT_FILE"],
                  scopes=["https://www.googleapis.com/auth/spreadsheets.readonly"],
              )
              service = build(
                  "sheets", "v4", credentials=credentials, cache_discovery=False,
              ).spreadsheets()
              spreadsheet = service.get(
                  spreadsheetId=spreadsheet_id,
                  fields="properties.title,sheets.properties.title",
              ).execute()
              emit("spreadsheet_title", spreadsheet["properties"]["title"])
              emit("sheet_titles", [
                  sheet["properties"]["title"]
                  for sheet in spreadsheet.get("sheets", [])
              ])

              stage = "Google Sheets operations watermarks"
              values = service.values().get(
                  spreadsheetId=spreadsheet_id,
                  range="operations!A:C",
                  valueRenderOption="UNFORMATTED_VALUE",
              ).execute().get("values", [])
              watermarks = operation_watermarks(values)
              eligible_count = 0
              missing_ids = []
              for account in accounts:
                  masked_id = "***" + account.id[-4:] if len(account.id) > 4 else "***"
                  eligible = account.status == "ACCOUNT_STATUS_OPEN" and account.type in (
                      "ACCOUNT_TYPE_TINKOFF", "ACCOUNT_TYPE_TINKOFF_IIS",
                  )
                  watermark = watermarks.get(account.id)
                  emit("account_watermark", {
                      "masked_account_id": masked_id,
                      "type": account.type,
                      "status": account.status,
                      "eligible": eligible,
                      "operations_watermark": watermark.isoformat() if watermark else "MISSING",
                  })
                  if eligible:
                      eligible_count += 1
                      if watermark is None:
                          missing_ids.append(masked_id)
              emit("watermark_preflight", {
                  "eligible_accounts_count": eligible_count,
                  "eligible_with_watermark": eligible_count - len(missing_ids),
                  "eligible_missing_watermark": len(missing_ids),
                  "eligible_missing_masked_ids": missing_ids,
              })
          except requests.exceptions.SSLError as exc:
              emit_exception("tls_failure", exc)
              print(f"Smoke FAILED at {stage}: {type(exc).__name__}", file=sys.stderr)
              sys.exit(1)
          except Exception as exc:
              # Exception bodies and tracebacks may contain IDs or API responses.
              print(f"Smoke FAILED at {stage}: {type(exc).__name__}", file=sys.stderr)
              sys.exit(1)

          print("Read-only smoke PASSED")
          PY

      - name: Clean up temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/credentials.json"
